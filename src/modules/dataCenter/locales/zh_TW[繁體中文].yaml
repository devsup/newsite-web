    merchantUvTip: 當天各商戶按「商戶 + IP」去重後的訪客數之和，同一 IP 點不同商戶分別計數。
    merchantUvChannelTip: 當天商戶點擊按「渠道 + IP」去重後的訪客數，同一 IP 在同一渠道點多個商戶只算 1。
    channelPvTip: 落地頁訪問 PV + 導航頁訪問 PV，不含下載與安裝。
    channelUvTip: 當天同一渠道按 IP 去重後的訪客數，各渠道分別去重後求和。
    merchantClickRatioTip: 導航頁 PV ÷ 導航頁 UV，反映導航頁人均訪問次數。
    naviPvTip: 導航頁訪問上報次數（navigation-report）。
    naviUvTip: 當天同一渠道的導航頁訪問按 IP 去重後的訪客數。
    landPvTip: 落地頁訪問上報次數（landing-report）。
    landUvTip: 當天同一渠道的落地頁訪問按 IP 去重後的訪客數。
