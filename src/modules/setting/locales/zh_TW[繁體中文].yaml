  subTitle: 提供被封禁 IP 地址的添加、編輯、刪除功能；命中的 IP 將被拒絕訪問後台
  ip: IP / 網段
  banReason: 封禁原因
  banReasonPlaceholder: 請填寫封禁原因，如「惡意刷接口」「異常掃描」，便於日後追溯
  currentIp: 當前訪問 IP
  updatedBy: 更新人
  ipPlaceholder: 如 192.168.1.5 或 10.0.0.0/24
