  palette: 配色預覽
  colorsHint: 16 個顏色留空則前端使用自身默認色
  applyPreset: 套用示例配色
  presetApplied: 已套用示例配色
  weight: 權重
  updatedBy: 更新人
  groupBasic: 基礎配色
  groupHeader: 頭部
