  palette: Palette
  colorsHint: Leave a color empty to use the front-end default
  applyPreset: Apply sample palette
  presetApplied: Sample palette applied
  weight: Weight
  updatedBy: Updated by
  groupBasic: Basic
  groupHeader: Header
  groupTabbar: Bottom menu
  groupCard: Card
  groupButton: Button
  groupColumn: Two-column
  text_color: Text color
  bg_color: Background color
  header_bg_color: Header background
  header_text_color: Header text
  text_selected_color: Selected text
  bottom_menu_bg: Bottom menu background
  bottom_menu_text: Bottom menu text
  bottom_menu_selected_color: Bottom menu selected
